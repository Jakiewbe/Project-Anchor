<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Project Anchor v1.6.0</title>
  <desc id="desc">File-based project memory and deterministic governance toolkit for AI agents. Keep the goal. Carry the context. Verify the work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081A1F"/>
      <stop offset="55%" stop-color="#0E2C33"/>
      <stop offset="100%" stop-color="#113840"/>
    </linearGradient>
    <radialGradient id="glow" cx="990" cy="195" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#glow)"/>

  <!-- Subtle architectural grid -->
  <g stroke="#1C4650" stroke-width="1" opacity="0.65">
    <path d="M0 72H1200M0 324H1200M810 0V400M990 0V400M1170 0V400"/>
    <path d="M810 135H1200M810 255H1200" stroke-dasharray="4 6"/>
  </g>

  <!-- Right anchor emblem -->
  <g transform="translate(990,195)">
    <circle r="126" fill="none" stroke="#225560" stroke-width="1.5"/>
    <circle r="100" fill="none" stroke="#2D6D78" stroke-width="1.5" stroke-dasharray="5 7"/>
    <circle r="74" fill="#0B2329" stroke="#265A64" stroke-width="1.5"/>
    <g fill="none" stroke="#5EEAD4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-48" r="15"/>
      <path d="M0 -31V54M-28 -8H28M-58 24C-52 60 -24 68 0 54C24 68 52 60 58 24M-58 24L-60 44M-58 24L-38 29M58 24L60 44M58 24L38 29"/>
    </g>
  </g>

  <!-- Left copy -->
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="64" y="34" width="298" height="26" rx="13" fill="#133A42" stroke="#296672"/>
    <circle cx="81" cy="47" r="4" fill="#5EEAD4"/>
    <text x="93" y="51.5" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99F6E4">FILE-BASED AGENT GOVERNANCE</text>

    <rect x="374" y="34" width="76" height="26" rx="13" fill="#0F766E"/>
    <text x="412" y="51.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">v1.6.0</text>

    <text x="62" y="146" font-size="68" font-weight="750" letter-spacing="-1.8" fill="#F8FAFC">Project Anchor</text>
    <rect x="64" y="164" width="128" height="4" rx="2" fill="url(#accent)"/>

    <text x="64" y="214" font-size="27" font-weight="600" fill="#CCFBF1">Keep the goal. Carry the context. Verify the work.</text>
    <text x="64" y="252" font-size="17" fill="#94B8BE">把目标、任务范围、决定与验收凭据锚定在仓库 .agent/ 中 — 换个会话，接着做对的事。</text>

    <!-- Bottom 4 feature pills -->
    <g font-size="12" font-weight="600" letter-spacing="0.8">
      <rect x="64" y="340" width="154" height="30" rx="8" fill="#103138" stroke="#235560"/>
      <text x="141" y="359.5" text-anchor="middle" fill="#CBD5E1">SINGLE .agent/ LEDGER</text>

      <rect x="230" y="340" width="170" height="30" rx="8" fill="#103138" stroke="#235560"/>
      <text x="315" y="359.5" text-anchor="middle" fill="#CBD5E1">EVIDENCE-BOUND SCOPE</text>

      <rect x="412" y="340" width="164" height="30" rx="8" fill="#103138" stroke="#235560"/>
      <text x="494" y="359.5" text-anchor="middle" fill="#CBD5E1">STDLIB PYTHON 3.11+</text>

      <rect x="588" y="340" width="166" height="30" rx="8" fill="#103138" stroke="#235560"/>
      <text x="671" y="359.5" text-anchor="middle" fill="#CBD5E1">MULTI-CLIENT SKILLS</text>
    </g>

    <text x="1136" y="359.5" text-anchor="end" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#5EEAD4">SCHEMA 4 · MIT</text>
  </g>
</svg>
