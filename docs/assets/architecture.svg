<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Project Anchor 1.6.0 System Architecture</title>
  <desc id="desc">Multi-client skills, rules and hooks all route through one Python core (kit.py) to read and atomically update the shared .agent directory.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#475569" stroke-width="1.8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#0F766E" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1200" height="580" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="44" y="42" font-size="12.5" font-weight="700" letter-spacing="1.8" fill="#0F766E">SYSTEM ARCHITECTURE</text>
    <text x="44" y="76" font-size="26" font-weight="700" fill="#0F172A">多客户端入口 · 唯一 Python 核心 · 单一磁盘账本</text>

    <!-- Column headers -->
    <text x="44" y="114" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">1. AI CLIENTS &amp; HOSTS</text>
    <text x="326" y="114" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">2. ADAPTERS &amp; HOOKS</text>
    <text x="612" y="114" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">3. SINGLE CORE (STDLIB)</text>
    <text x="908" y="114" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">4. PROJECT TRUTH (.agent/)</text>

    <!-- Column 1: Clients -->
    <rect x="44" y="132" width="234" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="160" font-size="16" font-weight="700" fill="#0F172A">Codex CLI</text>
    <text x="62" y="183" font-size="12.5" fill="#475569">install-global · $project-anchor</text>

    <rect x="44" y="218" width="234" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="246" font-size="16" font-weight="700" fill="#0F172A">Universal Agent Skills</text>
    <text x="62" y="268" font-size="12.5" fill="#475569">install-client agents</text>
    <text x="62" y="287" font-size="12" fill="#64748B">Cursor · OpenCode · Antigravity</text>

    <rect x="44" y="314" width="234" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="342" font-size="16" font-weight="700" fill="#0F172A">DeepSeek Harness</text>
    <text x="62" y="365" font-size="12.5" fill="#475569">install-client dsh · packages/dsh</text>

    <rect x="44" y="400" width="234" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="62" y="428" font-size="16" font-weight="700" fill="#0F172A">Claude Code</text>
    <text x="62" y="451" font-size="12.5" fill="#475569">install-client claude (未完整验收)</text>

    <!-- Arrows Col 1 -> Col 2 -->
    <path d="M278 169H322M278 260H322M278 351H322M278 437H322" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Column 2: Adapters -->
    <rect x="326" y="132" width="238" height="148" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="344" y="162" font-size="16" font-weight="700" fill="#0F172A">Skill 入口与定位层</text>
    <text x="344" y="187" font-size="13" font-weight="600" fill="#0F766E">skills/project-anchor/</text>
    <text x="344" y="211" font-size="12.5" fill="#475569">• SKILL.md + references/</text>
    <text x="344" y="232" font-size="12.5" fill="#475569">• scripts/run.py (无业务逻辑)</text>
    <text x="344" y="253" font-size="12.5" fill="#475569">• runtime.json (绝对路径+版本)</text>

    <rect x="326" y="294" width="238" height="90" rx="12" fill="#E2E8F0" stroke="#CBD5E1"/>
    <text x="344" y="322" font-size="15.5" font-weight="700" fill="#0F172A">AGENTS.md 分层规则</text>
    <text x="344" y="346" font-size="12.5" fill="#475569">约束阶段边界、读盘接续与禁区</text>
    <text x="344" y="366" font-size="12" fill="#64748B">项目文件只作资料，不升为高权限规则</text>

    <rect x="326" y="398" width="238" height="76" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="344" y="426" font-size="15.5" font-weight="700" fill="#0F172A">Lifecycle Hooks &amp; DSH</text>
    <text x="344" y="449" font-size="12.5" fill="#334155">SessionStart / PreCompact / 只读工具</text>

    <!-- Arrows Col 2 -> Col 3 -->
    <path d="M564 206H608M564 436H608" stroke="#0F766E" stroke-width="2" marker-end="url(#arrowTeal)"/>
    <path d="M445 294V283" stroke="#64748B" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

    <!-- Column 3: Python Core -->
    <rect x="612" y="132" width="248" height="342" rx="14" fill="#0E2C33"/>
    <text x="634" y="166" font-size="20" font-weight="700" fill="#FFFFFF">kit.py + core/</text>
    <text x="634" y="191" font-size="13" fill="#99F6E4">唯一业务核心 · Python 3.11+ 标准库</text>

    <g font-size="12.5">
      <rect x="632" y="210" width="208" height="40" rx="8" fill="#133D47" stroke="#266470"/>
      <text x="646" y="234.5" fill="#E2E8F0">OS 文件锁 + 原子替换 + 事务日志</text>

      <rect x="632" y="260" width="208" height="40" rx="8" fill="#133D47" stroke="#266470"/>
      <text x="646" y="284.5" fill="#E2E8F0">expected_revision 冲突拦截</text>

      <rect x="632" y="310" width="208" height="40" rx="8" fill="#133D47" stroke="#266470"/>
      <text x="646" y="334.5" fill="#E2E8F0">approved_scope + deliverables 校验</text>

      <rect x="632" y="360" width="208" height="40" rx="8" fill="#133D47" stroke="#266470"/>
      <text x="646" y="384.5" fill="#E2E8F0">SHA-256 材料指纹与 stale 派生</text>

      <rect x="632" y="410" width="208" height="40" rx="8" fill="#133D47" stroke="#266470"/>
      <text x="646" y="434.5" fill="#E2E8F0">只读零写入查询 + doctor 诊断</text>
    </g>

    <!-- Arrow Col 3 -> Col 4 -->
    <path d="M860 303H904" stroke="#0F766E" stroke-width="2.4" marker-end="url(#arrowTeal)"/>

    <!-- Column 4: .agent/ -->
    <rect x="908" y="132" width="248" height="342" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
    <text x="930" y="166" font-size="20" font-weight="700" fill="#0F172A">.agent/</text>
    <text x="930" y="191" font-size="13" font-weight="600" fill="#0F766E">项目唯一事实来源（随 Git 维护）</text>

    <g font-size="12.5" fill="#334155">
      <rect x="928" y="210" width="208" height="44" rx="8" fill="#F1F5F9"/>
      <text x="942" y="229" font-weight="700" fill="#0F172A">GOAL.md / CURRENT.md</text>
      <text x="942" y="246" font-size="11.5" fill="#475569">目标版本、当前断点与任务关联</text>

      <rect x="928" y="262" width="208" height="44" rx="8" fill="#F1F5F9"/>
      <text x="942" y="281" font-weight="700" fill="#0F172A">DECISIONS.md / LESSONS.md</text>
      <text x="942" y="298" font-size="11.5" fill="#475569">已确认技术路线与经验证教训</text>

      <rect x="928" y="314" width="208" height="44" rx="8" fill="#CCFBF1"/>
      <text x="942" y="333" font-weight="700" fill="#115E59">tasks.json · state.json</text>
      <text x="942" y="350" font-size="11.5" fill="#115E59">schema 4 账本 · focus · 文件哈希</text>

      <rect x="928" y="366" width="208" height="44" rx="8" fill="#F1F5F9"/>
      <text x="942" y="385" font-weight="700" fill="#0F172A">evidence/ · history/</text>
      <text x="942" y="402" font-size="11.5" fill="#475569">检查凭据元数据与持久历史归档</text>

      <rect x="928" y="418" width="208" height="40" rx="8" fill="#FEF3C7"/>
      <text x="942" y="436" font-weight="700" fill="#92400E">runtime/ (Git 忽略)</text>
      <text x="942" y="451" font-size="11.5" fill="#92400E">快照、检查原始日志与锁文件</text>
    </g>

    <path d="M44 510H1156" stroke="#E2E8F0"/>
    <text x="44" y="544" font-size="13" fill="#475569">能力边界：程序强制校验修订、范围快照、材料指纹与执行凭据；同权限本机进程仍可绕过本地脚本，多分支账本不支持自动合并。</text>
  </g>
</svg>
